name: npm-publish

# Publish the `gjallarhorn` CLI to npm when a version tag is pushed (e.g. v0.1.0).
# Separate from main.yml (which tests every push and deploys the AUR): npm releases
# are deliberate and tag-driven. The easiest way to cut one:
#
#     npm version patch          # bumps package.json, commits, and tags vX.Y.Z
#     git push --follow-tags     # pushes the commit (-> AUR) and the tag (-> npm)
#
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm provenance (--provenance) via OIDC

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node + the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Odin isn't needed to *publish* (the package ships source), but the smoke
      # test below compiles a scaffolded app, which needs the compiler.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg — bump package.json first"
            exit 1
          fi
          echo "publishing version $pkg"

      # Pack the real tarball, install it into a throwaway project, and drive the
      # CLI end to end — so a broken package is caught before it reaches npm.
      - name: Smoke test the package
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          tmp="$(mktemp -d)"
          ( cd "$tmp" && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund )
          gh="$tmp/node_modules/.bin/gjallarhorn"
          "$gh" help >/dev/null
          "$gh" docs --plain >/dev/null
          ( cd "$tmp" && "$gh" new demoapp && cd demoapp && odin build . -o:minimal -out:/tmp/demoapp )
          echo "smoke test passed"

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
