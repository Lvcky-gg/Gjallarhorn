name: npm-publish

# Publish the `gjallarhorn` CLI to npm when a version tag is pushed. The version is
# taken straight from the tag, so you never hand-edit package.json — just tag and
# push. Bare semver (1.0.4) and v-prefixed (v1.0.4) tags both work:
#
#     git tag 1.0.4 && git push origin 1.0.4
#
# Separate from main.yml (which tests every push and deploys the AUR): npm releases
# are deliberate and tag-driven.
on:
  push:
    tags:
      - '[0-9]*'   # bare semver, your convention: 1.0.4, 1.0.4-beta.1
      - 'v[0-9]*'  # v-prefixed also accepted: v1.0.4
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm provenance (--provenance) via OIDC

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node + the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Odin isn't needed to *publish* (the package ships source), but the smoke
      # test below compiles a scaffolded app, which needs the compiler.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pack the real tarball, install it into a throwaway project, and drive the
      # CLI end to end — so a broken package is caught before it reaches npm.
      - name: Smoke test the package
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          tmp="$(mktemp -d)"
          ( cd "$tmp" && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund )
          gh="$tmp/node_modules/.bin/gjallarhorn"
          "$gh" help >/dev/null
          "$gh" docs --plain >/dev/null
          ( cd "$tmp" && "$gh" new demoapp && cd demoapp && odin build . -o:minimal -out:/tmp/demoapp )
          echo "smoke test passed"

      # The published version comes from the tag (strip an optional leading "v"),
      # so package.json never has to be bumped by hand. workflow_dispatch (no tag)
      # publishes package.json's current version as-is.
      - name: Set version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "publishing $(node -p "require('./package.json').name")@$ver (tag: $GITHUB_REF_NAME)"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
